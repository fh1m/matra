[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matra"
version = "0.1.0"
description = "Metric scale and scene-dependent depth normalization in an archived visual-odometry system"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[project.scripts]
matra = "matra.experiment:main"

[tool.setuptools.packages.find]
include = ["matra*"]
